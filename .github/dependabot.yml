# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00" # UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    rebase-strategy: auto
    versioning-strategy: auto
    labels: ["dependencies", "rust"]
    allow:
      - dependency-type: "direct"
      - dependency-name: "libspa*"
        dependency-type: "all"
      - dependency-name: "pipewire-sys"
        dependency-type: "all"
    groups:
      pipewire:
        patterns:
          - "pipewire*"
          - "libspa*"

  - package-ecosystem: "npm"
    directory: "/vacs-client"
    schedule:
      interval: weekly
      day: monday
      time: "06:00" # UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    rebase-strategy: auto
    versioning-strategy: increase
    labels: ["dependencies", "node"]
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00" # UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/vacs-server"
    schedule:
      interval: weekly
      day: monday
      time: "06:00" # UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels: ["dependencies"]
