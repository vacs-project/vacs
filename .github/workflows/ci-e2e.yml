name: CI • E2E

on:
  workflow_call:

permissions: {}

jobs:
  e2e:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vacs-client

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the E2E environment
        uses: $/.github/actions/setup-e2e
        with:
          platform: ${{ matrix.platform }}

      - name: E2E tests (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        # xvfb-run wraps the whole runner: app processes are spawned by the
        # wdio launcher and helpers, which wdio's own xvfb handling does not
        # cover.
        run: xvfb-run npm test -w e2e
        env:
          RUST_BACKTRACE: "1"
          VACS_DATA_DIR: ${{ github.workspace }}/vacs-data

      - name: E2E tests (Windows, macOS)
        if: matrix.platform != 'ubuntu-24.04'
        run: npm test -w e2e
        env:
          RUST_BACKTRACE: "1"
          VACS_DATA_DIR: ${{ github.workspace }}/vacs-data

      - name: Summary
        shell: bash
        run: echo "### ✅ E2E tests passed (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
