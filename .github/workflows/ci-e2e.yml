name: CI • E2E

on:
  workflow_call:

permissions: {}

env:
  TAURI_DRIVER_VERSION: "2.0.6"
  # Keep in sync with the vatsim-api rev in Cargo.lock.
  VATSIM_API_REV: "299fb617d343c1c83f9f4fea040f0b66afe5ae7e"

jobs:
  e2e:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vacs-client

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout dataset
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: vacs-project/vacs-data
          # The E2E specs depend on LO dataset specifics (positions,
          # frequencies, coverage chains); bump deliberately when specs
          # are updated for newer dataset states.
          ref: 39b4712a10b3c84566d3d4b50caf972ed1381769
          path: vacs-data
          sparse-checkout: dataset
          persist-credentials: false

      - name: Start Valkey (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          docker run -d --name valkey -p 6379:6379 \
            --health-cmd "valkey-cli ping" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 5 \
            valkey/valkey:9-alpine
          until [ "$(docker inspect --format='{{.State.Health.Status}}' valkey)" = "healthy" ]; do sleep 1; done
        working-directory: .

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: ./.github/actions/install-linux-deps

      - name: Install E2E system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb webkit2gtk-driver

      - name: Setup Node (LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: vacs-client/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: e2e-${{ matrix.platform }}

      - name: Cache tauri-driver and vatsim-mock binaries
        id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/vatsim-mock
          key: e2e-tools-${{ runner.os }}-tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-vatsim-api-${{ env.VATSIM_API_REV }}

      - name: Install tauri-driver and vatsim-mock
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked
          # Switch to crates.io version of vatsim-api once the crate is published - install from git until then
          cargo install --git https://github.com/MorpheusXAUT/vatsim-api --rev "$VATSIM_API_REV" --features mock-bin --bin vatsim-mock --locked
        shell: bash

      - name: Compute browser cache key
        id: browser-week
        # Rotate weekly: "stable" moves on its own cadence, so a fresh key
        # forces at most one re-download per week while restore-keys keep
        # serving the previous browser in the meantime.
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wdio-browsers
          key: e2e-browsers-${{ runner.os }}-${{ steps.browser-week.outputs.week }}
          restore-keys: e2e-browsers-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: E2E tests (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: xvfb-run npm test -w e2e
        env:
          RUST_BACKTRACE: "1"
          VACS_DATA_DIR: ${{ github.workspace }}/vacs-data

      - name: Summary
        shell: bash
        run: echo "### ✅ E2E tests passed (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
