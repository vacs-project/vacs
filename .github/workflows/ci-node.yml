name: CI • Node

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vacs-client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: vacs-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run -w frontend typecheck

      - name: Lint
        run: npm run -w frontend lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test -w frontend

      - name: Summary
        run: echo "### ✅ Node CI - typecheck, lint, format & tests passed" >> $GITHUB_STEP_SUMMARY
