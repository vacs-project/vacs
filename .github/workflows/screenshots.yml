name: Documentation screenshots

on:
  # A workflow that is not on the default branch cannot be dispatched, so the
  # capture branch of a release runs on push with the defaults below.
  push:
    branches:
      - screenshots/2.8.0
  workflow_dispatch:
    inputs:
      platform:
        description: "Runner to capture on"
        type: choice
        options:
          - windows-latest
          - ubuntu-24.04
          - macos-latest
        default: windows-latest
      version:
        description: "Version to show in the captured UI (defaults to the client's package.json)"
        type: string
        required: false

permissions: {}

jobs:
  screenshots:
    runs-on: ${{ inputs.platform || 'windows-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PLATFORM: ${{ inputs.platform || 'windows-latest' }}
      VERSION: ${{ inputs.version || '2.8.0' }}
    defaults:
      run:
        working-directory: vacs-client

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the E2E environment
        uses: $/.github/actions/setup-e2e
        with:
          # Same key the test workflow uses, so a capture starts from its
          # warm cache instead of a cold workspace build.
          platform: ${{ env.PLATFORM }}

      - name: Capture screenshots (Linux)
        if: env.PLATFORM == 'ubuntu-24.04'
        run: xvfb-run npm run screenshots -w e2e
        env:
          RUST_BACKTRACE: "1"
          VACS_DATA_DIR: ${{ github.workspace }}/vacs-data
          VACS_SCREENSHOT_VERSION: ${{ env.VERSION }}

      - name: Capture screenshots (Windows, macOS)
        if: env.PLATFORM != 'ubuntu-24.04'
        run: npm run screenshots -w e2e
        env:
          RUST_BACKTRACE: "1"
          VACS_DATA_DIR: ${{ github.workspace }}/vacs-data
          VACS_SCREENSHOT_VERSION: ${{ env.VERSION }}

      # Uploaded even on failure: a run that captures ten of thirteen images
      # and then trips over one case still produces usable output, and the
      # partial set shows what the failing case saw.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ env.PLATFORM }}
          path: vacs-client/e2e/screenshots
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            echo "### Documentation screenshots ($PLATFORM)"
            echo
            echo "Download the \`screenshots-$PLATFORM\` artifact and copy its"
            echo "contents into the docs repo's \`static/img/\`."
            echo
            find vacs-client/e2e/screenshots -type f -name '*.png' | sort | sed 's|^vacs-client/e2e/screenshots/|- |'
          } >> "$GITHUB_STEP_SUMMARY"
