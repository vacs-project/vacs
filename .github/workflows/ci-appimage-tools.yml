name: CI • AppImage tools

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pins against the tauri bundler
        run: python3 .github/scripts/appimage_tools.py check-bundler

      - name: Verify the pinned files upstream
        run: python3 .github/scripts/appimage_tools.py verify
