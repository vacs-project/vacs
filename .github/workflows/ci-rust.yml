name: CI • Rust

on:
  workflow_call:

permissions: {}

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # prevent a sudden announcement of a new advisory from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
          command: check ${{ matrix.checks }}

      - name: Summary
        run: echo "### ✅ Cargo Deny - ${{ matrix.checks }}" >> $GITHUB_STEP_SUMMARY

  cargo-machete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo machete
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

      - name: Summary
        run: echo "### ✅ Cargo Machete - no unused dependencies" >> $GITHUB_STEP_SUMMARY

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Summary
        run: echo "### ✅ Rustfmt - all files formatted" >> $GITHUB_STEP_SUMMARY

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies (Linux)
        uses: $/.github/actions/install-linux-deps

      - name: Free disk space on runner
        run: rm -rf /opt/hostedtoolcache

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features

      # The joystick service roundtrip drives SDL's event loop with a virtual
      # device and is #[ignore]d to keep regular test runs hermetic; execute it
      # explicitly (no hardware or display required).
      - name: Joystick service end-to-end tests
        run: cargo test --locked -p vacs-client --all-features virtual_joystick -- --include-ignored

      # The X11 keybind roundtrip test injects global key events via XTest and
      # is therefore #[ignore]d for regular runs; execute it explicitly against
      # an isolated headless X server.
      - name: X11 keybind end-to-end tests
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run --auto-servernum cargo test --locked -p vacs-client --all-features x11 -- --include-ignored

      - name: Summary
        run: echo "### ✅ Tests - all workspace tests passed" >> $GITHUB_STEP_SUMMARY

  clippy:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
            arch: "x86_64"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            arch: "x86_64"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            arch: "aarch64"
            target: "aarch64-apple-darwin" # for Arm based macs (M1 and above).

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: $/.github/actions/install-linux-deps

      - name: Install build dependencies (macOS, aarch64)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'aarch64'
        run: |
          brew update
          brew install opus

      - name: Install build dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        uses: $/.github/actions/install-windows-deps

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Summary
        run: echo "### ✅ Clippy - ${{ matrix.platform }} (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
