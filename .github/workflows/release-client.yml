name: Release • vacs-client

on:
  push:
    tags:
      - "vacs-client-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (1.2.3, v1.2.3, or vacs-client-v1.2.3)"
        required: true
        type: string
      ref:
        description: "Git ref to build (branch/tag/SHA). Empty = default branch tip."
        required: false
        default: ""
        type: string

permissions: {}

# Never cancel a half-finished release.
concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      draft: ${{ steps.vars.outputs.draft }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      rc: ${{ steps.vars.outputs.rc }}
      release_name: ${{ steps.vars.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve version & tag
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW="${INPUT_VERSION}"
          else
            RAW="${GITHUB_REF_NAME}"  # e.g. vacs-client-v1.2.3
          fi

          # Extract X.Y.Z from: 1.2.3 | v1.2.3 | vacs-client-v1.2.3 | 1.2.3-rc.1
          if [[ "$RAW" =~ ([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?) ]]; then
            VER="${BASH_REMATCH[1]}"
          else
            echo "Could not parse semver from: $RAW" >&2
            exit 1
          fi

          TAG="vacs-client-v${VER}"
          REL_NAME="vacs-client: v${VER}"

          # Draft release when manual; published on tag-push
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DRAFT=true
          else
            DRAFT=false
          fi

          # Mark prerelease if version contains a prerelease part (e.g., -rc.1)
          if [[ "$VER" =~ -[A-Za-z0-9] ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # Detect release candidate (RC) builds (case-insensitive, matches -rc, -rc.1, -RC.2, etc.)
          if [[ "$VER" =~ -[rR][cC][.0-9]* ]]; then
            RC=true
          else
            RC=false
          fi

          echo "version=$VER"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "rc=$RC"             >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # No cargo/npm cache restore in release jobs: caches are writable by ordinary CI
      # runs, and a poisoned cache would end up inside signed, attested artifacts.
      - name: Setup Node (LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install npm dependencies
        working-directory: vacs-client
        run: npm ci

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      # Keep the version pin in step with vacs-data's release-tools.yml.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features="cli" --version 0.9.2

      - name: Generate third-party licenses
        run: python3 scripts/generate-licenses.py --output THIRD_PARTY_LICENSES.html

      - name: Upload licenses artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [prep, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
            arch: "x86_64"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            arch: "x86_64"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            arch: "aarch64"
            target: "aarch64-apple-darwin" # for Arm based macs (M1 and above).
          - platform: "macos-latest"
            arch: "x86_64"
            target: "x86_64-apple-darwin" # for Intel based macs.

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    environment: release-client
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Prepare additional version information for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ needs.prep.outputs.tag }}
          VERSION: ${{ needs.prep.outputs.version }}
          RC: ${{ needs.prep.outputs.rc }}
        run: |
          # create/update a lightweight tag locally so vergen sees it
          git tag -f "$TAG" HEAD
          git describe --tags --always
          # override version info built into client
          echo "VACS_VERSION_OVERRIDE=$VERSION" >> "$GITHUB_ENV"

          RC_ARGS=""
          if [[ "$RC" == "true" ]]; then
            RC_ARGS="--config tauri.rc.conf.json"
            echo "CARGO_FEATURES=--features rc" >> "$GITHUB_ENV"
          fi

          # build tauri user config with version info and release config
          echo "EXTRA_TAURI_ARGS=--config '{\"version\":\"$VERSION\"}' --config tauri.release.conf.json $RC_ARGS" >> "$GITHUB_ENV"

      - name: Set release tauri config
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          RC: ${{ needs.prep.outputs.rc }}
        run: |
          RC_ARGS=""
          if [[ "$RC" == "true" ]]; then
            RC_ARGS="--config tauri.rc.conf.json"
            echo "CARGO_FEATURES=--features rc" >> "$GITHUB_ENV"
          fi
          echo "EXTRA_TAURI_ARGS=--config tauri.release.conf.json $RC_ARGS" >> "$GITHUB_ENV"

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: ./.github/actions/install-linux-deps

      # Kept out of tauri.conf.json because the source paths are Debian specific and the bundler
      # aborts when one is missing, which would break AppImage builds on any other distribution.
      - name: Bundle the PipeWire plugins into the AppImage (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: echo "EXTRA_TAURI_ARGS=${EXTRA_TAURI_ARGS} --config tauri.appimage.conf.json" >> "$GITHUB_ENV"

      - name: Install build dependencies (macOS, aarch64)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'aarch64'
        run: |
          brew update
          brew install opus

      # Intel Homebrew under Rosetta is the only way to get an x86_64 opus onto the
      # arm64 runner; the SHA pin keeps this from executing a mutable ref.
      - name: Install build dependencies (macOS, x86_64)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'x86_64'
        run: |
          if [ ! -f /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/cced90146ea6d3057c03a636b668fef177415eb3/install.sh)"
          fi

          arch -x86_64 /usr/local/bin/brew update
          arch -x86_64 /usr/local/bin/brew install opus

          echo "PKG_CONFIG_PATH=/usr/local/opt/opus/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Install build dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/install-windows-deps

      # No cargo/npm cache restore here either - see the licenses job.
      - name: Setup Node (LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: vacs-client
        run: npm ci

      - name: Download third-party licenses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses

      - name: Build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
          TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ secrets.TAURI_SIGNING_RPM_KEY_PASSPHRASE }}
        with:
          projectPath: vacs-client
          args: ${{ matrix.target && format('--target {0}', matrix.target) }} ${{ env.EXTRA_TAURI_ARGS }} ${{ env.CARGO_FEATURES }}
          uploadUpdaterJson: false

      - name: Rename macOS bundles to include version & architecture
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prep.outputs.version }}
          ARCH: ${{ matrix.arch }}
          RC: ${{ needs.prep.outputs.rc }}
        run: |
          if [[ "$TARGET" == "" ]]; then
            BUNDLE_DIR="target/release/bundle"
          else
            BUNDLE_DIR="target/${TARGET}/release/bundle"
          fi

          if [[ "$RC" == "true" ]]; then
            NAME="vacs-rc"
          else
            NAME="vacs"
          fi

          if [[ -f "$BUNDLE_DIR/macos/${NAME}.app.tar.gz" ]]; then
            mv "$BUNDLE_DIR/macos/${NAME}.app.tar.gz" "$BUNDLE_DIR/macos/${NAME}_${VERSION}_${ARCH}.app.tar.gz"
          fi
          if [[ -f "$BUNDLE_DIR/macos/${NAME}.app.tar.gz.sig" ]]; then
            mv "$BUNDLE_DIR/macos/${NAME}.app.tar.gz.sig" "$BUNDLE_DIR/macos/${NAME}_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi

      - name: Upload bundles as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.msi.sig
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.exe.sig
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.deb.sig
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.rpm.sig
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.AppImage.sig
            target/**/release/bundle/macos/vacs*_*_*.app.tar.gz
            target/**/release/bundle/macos/vacs*_*_*.app.tar.gz.sig
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/dmg/*.dmg.sig

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          artifact-name: sbom-${{ matrix.platform }}-${{ matrix.arch }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.msi.sig
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.exe.sig
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.deb.sig
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.rpm.sig
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.AppImage.sig
            target/**/release/bundle/macos/vacs*_*_*.app.tar.gz
            target/**/release/bundle/macos/vacs*_*_*.app.tar.gz.sig
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/dmg/*.dmg.sig

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/macos/vacs*_*_*.app.tar.gz
            target/**/release/bundle/dmg/*.dmg
          sbom-path: sbom.spdx.json

  release:
    needs: [prep, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-client
    permissions:
      contents: read # write access for the release is via the App token below
      attestations: write
      id-token: write

    steps:
      - name: Download bundles from artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          out="SHA256SUMS-${VERSION}.txt"
          : > "$out"
          while IFS= read -r -d '' f; do
            sum=$(shasum -a 256 "$f" | cut -d' ' -f1)
            echo "$sum  $(basename "$f")" >> "$out"
          done < <(find . -type f \
            ! -name 'SHA256SUMS*' \
            ! -name '*.app' \
            -print0 | sort -z)

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums using Cosign with GitHub OIDC Token
        working-directory: dist
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          cosign sign-blob --yes \
            --bundle "SHA256SUMS-${VERSION}.txt.bundle.json" \
            "SHA256SUMS-${VERSION}.txt"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-${{ needs.prep.outputs.version }}.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS-${{ needs.prep.outputs.version }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # Release-body content is contributor-controlled; it must only ever flow through
      # `with:` parameters, never through a shell.
      - name: Create/update GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.generate-token.outputs.token }}
          tag_name: ${{ needs.prep.outputs.tag }}
          name: ${{ needs.prep.outputs.release_name }}
          draft: ${{ needs.prep.outputs.draft }}
          prerelease: ${{ needs.prep.outputs.prerelease }}
          make_latest: ${{ needs.prep.outputs.draft == 'false' && needs.prep.outputs.prerelease == 'false' }}
          append_body: true
          body: |

            ---

            ## Looking for downloads or missing an installer?

            GitHub collapses the assets section on long release notes. Click the **"Assets"** heading below to expand it, then click **"Show all assets"** at the bottom of the list to see all available downloads. Alternatively, use the download button on [our website](https://vacs.network) for easier access.

            For detailed installation instructions, visit [our documentation](https://docs.vacs.network/getting-started/installation).
          files: |
            dist/**

  update-brew-tap:
    needs: [prep, release]
    if: |
      needs.prep.outputs.draft == 'false' &&
      needs.prep.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-client
    permissions: {}

    steps:
      # Same-run artifact rather than the public release URL, so the tap update can
      # only ever describe the checksums this run produced.
      - name: Download checksums artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums

      - name: Extract checksums for macOS DMG files
        id: hashes
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          AARCH64=$(grep "vacs_${VERSION}_aarch64.dmg$" "SHA256SUMS-${VERSION}.txt" | awk '{print $1}')
          X64=$(grep  "vacs_${VERSION}_x64.dmg$"  "SHA256SUMS-${VERSION}.txt" | awk '{print $1}')

          if [[ -z "$AARCH64" || -z "$X64" ]]; then
            echo "ERROR: Could not parse one or both DMG hashes from SHA256SUMS.txt" >&2
            echo "  aarch64: '$AARCH64'"  >&2
            echo "  x64:     '$X64'"   >&2
            exit 1
          fi

          echo "aarch64=$AARCH64" >> "$GITHUB_OUTPUT"
          echo "x64=$X64"         >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token (tap repo access)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scope token to the tap repo only
          owner: vacs-project
          repositories: homebrew-tap
          permission-contents: write

      # The commit goes through ghcommit's API, so the checkout needs no credentials.
      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vacs-project/homebrew-tap
          persist-credentials: false

      - name: Update cask version and hashes
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          AARCH64: ${{ steps.hashes.outputs.aarch64 }}
          X64: ${{ steps.hashes.outputs.x64 }}
        run: |
          sed -i \
            -e "s/version \"[0-9.]*\"/version \"${VERSION}\"/" \
            -e "s/arm:   \"[0-9a-f]\{64\}\"/arm:   \"${AARCH64}\"/" \
            -e "s/intel: \"[0-9a-f]\{64\}\"/intel: \"${X64}\"/" \
            Casks/vacs.rb

      - name: Commit updated cask
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore: update vacs cask to version ${{ needs.prep.outputs.version }}"
          repo: "vacs-project/homebrew-tap"
          branch: "main"
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
