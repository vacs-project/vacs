name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Target branch to prepare releases from (leave empty for default behavior)."
        required: false
        default: ""
        type: string

permissions: {}

# Two pushes to main must not race on the same release PR.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-please
    outputs:
      prs: ${{ steps.release.outputs.prs }}

    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vacs
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.ref_name }}
          token: ${{ steps.generate-token.outputs.token }}

  update-lockfiles:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs }}
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.release-please.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-please

    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vacs
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.pr.headBranchName }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ubuntu-24.04-x86_64"

      - name: Update cargo workspace lockfile
        run: cargo update -w

      - name: Setup Node (LTS)
        if: contains(matrix.pr.headBranchName, 'vacs-client')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: vacs-client/package-lock.json

      - name: Update npm workspace lockfile
        if: contains(matrix.pr.headBranchName, 'vacs-client')
        working-directory: vacs-client
        run: npm install --package-lock-only

      - name: Commit updated lockfiles
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore(lockfile): refresh cargo & npm lockfiles after version bumps"
          repo: ${{ github.repository }}
          branch: ${{ matrix.pr.headBranchName }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
