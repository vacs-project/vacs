[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc"
]
all-features = false
no-default-features = false
features = ["test-utils"]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "tauri dependency" },
    { id = "RUSTSEC-2024-0436", reason = "tower-sessions-redis-store dependency" },
    { id = "RUSTSEC-2026-0194", reason = "tauri/ashpd/rfd dependency" },
    { id = "RUSTSEC-2026-0195", reason = "tauri/ashpd/rfd dependency" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 via tauri-plugin-single-instance, ashpd is on zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 via tauri-plugin-single-instance, ashpd is on zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 via tauri-plugin-single-instance, ashpd is on zbus 6" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via webrtc 0.17 dtls, fixed only by the webrtc 0.21 migration" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via hyper and nix 0.26, no fixed release" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]
exceptions = [
    { allow = ["CC0-1.0"], crate = "notify" },
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["Zlib"], crate = "sdl3-sys" },
    { allow = ["Zlib"], crate = "sdl3-src" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/maxcountryman/axum-login",
    "https://github.com/maxcountryman/tower-sessions-stores",
    "https://github.com/aembke/redis-protocol.rs",
]

[sources.allow-org]
github = []
