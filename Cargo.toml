[workspace]
resolver = "3"
members = [
    "vacs-audio",
    "vacs-client",
    "vacs-macros",
    "vacs-protocol",
    "vacs-server",
    "vacs-signaling",
    "vacs-vatsim",
    "vacs-webrtc"
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vacs-project/vacs"
publish = false

[workspace.dependencies]
anyhow = "1.0.102"
ashpd = { version = "0.13.11", features = ["global_shortcuts", "raw_handle", "wayland"] }
async-trait = "0.1.89"
axum = "0.8.9"
axum-client-ip = "1.3.1"
# Source-patched to a fork, see [patch.crates-io].
axum-login = "=0.18.0"
axum-prometheus = "0.10.0"
base64 = "0.23.0"
biquad = "0.6.0"
bytes = "1.11.1"
chacha20poly1305 = "0.11.0"
config = "0.15.23"
cookie_store = "0.22.1"
cpal = { version = "0.18.1", features = ["pipewire"] }
csv = "1.4.0"
dashmap = "6.2.1"
flate2 = "1.1.9"
futures-util = "0.3.32"
governor = "0.10.4"
hmac = "0.13.0"
hound = "3.5.1"
http = "1.4.1"
http-body-util = "0.1.3"
jsonwebtoken = "10.4.0"
keyboard-types = { version = "0.8.3", features = ["serde"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-openssl"] }
log = "0.4.30"
lru = "0.18.0"
metrics = "0.24.6"
nonzero_ext = "0.3.0"
notify-debouncer-full = "0.7.0"
objc2-core-foundation = "0.3.1"
objc2-core-graphics = "0.3.1"
oauth2 = { version = "5.0.0", default-features = false }
octocrab = "0.54.0"
opus = "0.4.0"
parking_lot = "0.12.5"
pipewire = "0.10.0"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.95"
quote = "1.0.45"
rand = "0.10.1"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["cookies", "json", "query", "rustls"] }
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
ringbuf = "0.5.0"
rubato = "5.0.0"
rustls = { version = "0.23.40", features = ["aws-lc-rs"] }
sdl3 = { version = "0.18.4", features = ["build-from-source-static"] }
# Slim the vendored SDL3 static build down to the joystick subsystem (we use SDL solely
# for global joystick button capture); notably no-sdl-video avoids X11/Wayland build deps.
sdl3-sys = { version = "0.6.7", features = [
    # Required for a video-less build on Linux; no effect on Windows/macOS.
    "sdl-unix-console-build",
    "no-sdl-video",
    "no-sdl-audio",
    "no-sdl-gpu",
    "no-sdl-render",
    "no-sdl-camera",
    "no-sdl-haptic",
    "no-sdl-power",
    "no-sdl-sensor",
    "no-sdl-dialog",
    "no-sdl-tray",
] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
syn = { version = "3.0.2", features = ["full"] }
sysinfo = "0.39.3"
tar = "0.4.46"
tauri = "2.11.2"
tauri-build = "2.6.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-prevent-default = "5.0.0"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "process", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls", "rustls-tls-native-roots"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tower-http = "0.7.0"
tower-sessions = { version = "0.15.0", features = ["signed"] }
# Source-patched to an unreleased upstream commit, see [patch.crates-io].
tower-sessions-redis-store = "=0.16.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing = { version = "0.1.44", features = ["log"] }
trackaudio = "0.2.2"
url = "2.5.8"
uuid = { version = "1.23.2", features = ["v7", "serde"] }
vacs-audio = { path = "vacs-audio" }
vacs-macros = { path = "vacs-macros" }
vacs-protocol = { path = "vacs-protocol" }
vacs-server = { path = "vacs-server" }
vacs-signaling = { path = "vacs-signaling" }
vacs-vatsim = { path = "vacs-vatsim", default-features = false }
vacs-webrtc = { path = "vacs-webrtc" }
vergen-git2 = { version = "10.0.0", features = ["build", "cargo", "rustc"] }
wasapi = "0.24.0"
webrtc = "0.17.1"
x11rb = { version = "0.14.0", features = ["xinput", "xtest"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading"
] }
wiremock = "0.6.5"

[patch.crates-io]
# Forks and unreleased upstream commits belong here rather than as a `git` dependency in
# [workspace.dependencies]. A git dependency carries no crates.io version requirement, so
# dependabot stops watching the crate and nothing tells us when the fork can be dropped. Pin the
# requirement exactly (`=x.y.z`) so any new upstream release forces a dependabot PR; that bump
# then makes the patch semver-incompatible, cargo reports "patch ... was not used in the crate
# graph" and resolves the real crate, which is the signal to delete the entry here.
#
# redis-protocol 6.0.0 pins cookie-factory to the exact version "=0.3.2", which
# conflicts with libspa >=0.9 (needs cookie-factory ^0.3.3) and blocks bumping
# pipewire past 0.8.0. This branch is currently unreleased and relaxes the pin to "^0.3.2";
# drop once upstream (aembke/redis-protocol.rs) publishes 6.1.0.
redis-protocol = { git = "https://github.com/aembke/redis-protocol.rs", rev = "cdd4535155437d08171a68c9965963fc1092eeb6" }
# cpal 0.18.1 rejects WASAPI output formats that IsFormatSupported only reports as
# convertible (S_FALSE), breaking startup on multi-channel devices like SteelSeries Sonar.
# Fixed upstream by https://github.com/RustAudio/cpal/pull/1275. This rev also carries
# https://github.com/RustAudio/cpal/issues/1273, where WASAPI flagged every capture
# stream's first buffer as an xrun. Drop once 0.18.2 is released.
cpal = { git = "https://github.com/RustAudio/cpal", rev = "23ec3f74d0a05166e896feb7ad329e6c366a7f02" }
# axum-login 0.18.0 depends on tower-sessions 0.14 and blocks our 0.15 bump. Upstream merged
# https://github.com/maxcountryman/axum-login/pull/315 but has not published since; this fork is
# 0.18.0 plus that PR. Drop once upstream releases a version containing it.
axum-login = { git = "https://github.com/MorpheusXAUT/axum-login", rev = "ce98c33e1fe6db4a11ece0afa307ba880ff033a5" }
# tower-sessions-redis-store 0.16.0 depends on tower-sessions-core 0.14 and blocks our
# tower-sessions 0.15 bump. Upstream main carries the 0.15 support under the same, still
# unpublished, 0.16.0 version number. Drop once a release newer than 0.16.0 is published.
tower-sessions-redis-store = { git = "https://github.com/maxcountryman/tower-sessions-stores", rev = "be0f230fadb4ca0496d4cabc946ae7778eee37e6" }

[workspace.lints.clippy]
semicolon-if-nothing-returned = "warn"

# Build the vendored SDL3 with release settings even in dev builds. The cmake
# crate maps opt-level 0 to CMAKE_BUILD_TYPE=Debug, which on MSVC compiles SDL
# against the debug CRT (/MDd) and conflicts with the release CRT rustc always
# links (LNK4098). SDL is a C dependency we never step through anyway.
[profile.dev.package.sdl3-sys]
opt-level = 2
debug = false
