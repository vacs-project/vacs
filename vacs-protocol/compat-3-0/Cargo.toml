[package]
name = "vacs-protocol-compat-3-0"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Kept out of the main workspace: two packages named `vacs-protocol` in one lockfile make every
# `cargo -p vacs-protocol` there ambiguous.
[workspace]

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.2", features = ["v7", "serde"] }
vacs-protocol = { path = "..", features = ["ws"] }
vacs-protocol-3-0 = { package = "vacs-protocol", git = "https://github.com/vacs-project/vacs", tag = "vacs-client-v3.0.0", features = ["ws"] }
